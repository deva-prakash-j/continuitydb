openapi: 3.1.0
info:
  title: ContinuityDB API
  version: 0.8.0
  description: Versioned REST and Streamable HTTP MCP API for governed, portable agent memory and context packs.
servers:
  - url: http://127.0.0.1:7331
security:
  - bearerAuth: []
paths:
  /.well-known/oauth-protected-resource/mcp:
    get:
      security: []
      operationId: getMcpProtectedResourceMetadata
      description: RFC 9728 protected-resource metadata, available when OIDC is configured.
      responses:
        "200":
          description: OAuth protected-resource metadata for the MCP endpoint
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { description: OIDC is not configured }
  /mcp:
    post:
      operationId: handleMcpMessage
      description: Stateful MCP Streamable HTTP JSON-RPC initialization, discovery, and tool calls.
      parameters:
        - $ref: "#/components/parameters/McpSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, additionalProperties: true }
                - { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200": { description: MCP JSON-RPC response }
        "400": { description: Invalid MCP request or missing initialization }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: MCP session belongs to another identity }
    get:
      operationId: streamMcpMessages
      description: Resume or receive messages for an initialized MCP session.
      parameters:
        - $ref: "#/components/parameters/McpSessionIdRequired"
      responses:
        "200": { description: MCP message stream or protocol response }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: terminateMcpSession
      description: Explicitly terminate an initialized MCP session.
      parameters:
        - $ref: "#/components/parameters/McpSessionIdRequired"
      responses:
        "200": { description: MCP session terminated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      operationId: readiness
      responses:
        "200": { description: Storage is queryable }
  /ui:
    get:
      operationId: reviewInboxUi
      description: Opt-in same-origin review inbox. Disabled unless CONTINUITYDB_ENABLE_REVIEW_UI=true.
      responses:
        "200": { description: Review inbox HTML }
        "404": { description: Review UI is disabled }
  /v1/search:
    post:
      operationId: searchMemories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: ACL-filtered results
          content:
            application/json:
              schema:
                type: object
                required: [results, retrieval]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/MemoryResult" } }
                  retrieval: { $ref: "#/components/schemas/RetrievalMetadata" }
        "400": { description: Invalid retrieval mode, depth, graph budget, or search field }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/context-packs:
    post:
      operationId: buildContextPack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, minLength: 1 }
                project_id: { type: string }
                dependency_depth: { type: integer, minimum: 0, maximum: 5, default: 2 }
                top_k: { type: integer, minimum: 1, maximum: 50, default: 8 }
                token_budget: { type: integer, minimum: 64, maximum: 32000, default: 1200 }
                branch: { type: string }
                as_of: { type: string, format: date-time }
                include_stale: { type: boolean, default: false }
                exclude_types: { type: array, maxItems: 32, items: { type: string } }
                retrieval_mode: { type: string, enum: [hybrid, graph-only, graph-first], default: hybrid }
                graph_depth: { type: integer, minimum: 0, maximum: 3, default: 2 }
                strict_evidence: { type: boolean, default: false }
                graph_max_visited: { type: integer, minimum: 25, maximum: 2000, default: 400 }
                graph_max_paths: { type: integer, minimum: 1, maximum: 200, default: 40 }
      responses:
        "200": { description: Token-bounded cited context pack }
        "400": { description: Invalid retrieval mode, depth, graph budget, or context field }
  /v1/memories/proposals:
    post:
      operationId: proposeMemory
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201": { description: Proposal created }
        "200": { description: Existing idempotent proposal returned }
  /v1/memories:
    get:
      operationId: listReviewMemories
      parameters:
        - name: status
          in: query
          schema: { type: string, default: "proposed,quarantined" }
        - name: project_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: Caller-visible memories for governance review }
  /v1/memories/captures:
    post:
      operationId: captureMemory
      description: Server policy binds identity and returns active, proposed, or quarantined disposition.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureRequest" }
      responses:
        "201": { description: Capture evaluated and persisted }
        "200": { description: Existing idempotent capture returned }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/memories/{id}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getMemory
      responses:
        "200": { description: Active memory }
        "404": { description: Not found in caller scope }
    delete:
      operationId: forgetMemory
      responses:
        "200": { description: Tombstoned; purge is an asynchronous policy action }
  /v1/memories/{id}/commit:
    post:
      operationId: commitMemory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200": { description: Proposed or quarantined memory explicitly approved and optionally indexed }
        "409": { description: Handoff approval rejected because its predecessor is no longer the latest active checkpoint }
  /v1/memories/{id}/revisions:
    post:
      operationId: reviseHeldMemory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement]
              properties:
                reason: { type: string }
                replacement:
                  type: object
                  additionalProperties: false
                  properties:
                    title: { type: string, minLength: 1, maxLength: 500 }
                    body: { type: string, minLength: 1, maxLength: 1000000 }
                    branch: { type: [string, "null"], maxLength: 200 }
                    confidence: { type: number, minimum: 0, maximum: 1 }
                    importance: { type: number, minimum: 0, maximum: 1 }
                    tags: { type: array, maxItems: 64, items: { type: string } }
                    handoff: { $ref: "#/components/schemas/HandoffPatch" }
      responses:
        "200": { description: Held memory corrected and returned to proposed status }
  /v1/memories/{id}/corrections:
    post:
      operationId: correctMemory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replacement]
              properties:
                reason: { type: string }
                replacement:
                  type: object
                  additionalProperties: true
                  properties:
                    body: { type: string, minLength: 1, maxLength: 1000000 }
                    title: { type: string, minLength: 1, maxLength: 500 }
                    branch: { type: [string, "null"], maxLength: 200 }
                    confidence: { type: number, minimum: 0, maximum: 1 }
                    importance: { type: number, minimum: 0, maximum: 1 }
                    tags: { type: array, maxItems: 64, items: { type: string } }
                    handoff: { $ref: "#/components/schemas/HandoffPatch" }
      responses:
        "200": { description: New active version created; prior version superseded }
  /v1/memories/{id}/feedback:
    post:
      operationId: recordMemoryFeedback
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal: { type: string, enum: [helpful, incorrect, outdated] }
                reason: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Non-destructive feedback recorded }
        "404": { description: Memory is not visible to this caller }
  /v1/project-links:
    post:
      operationId: linkProjects
      responses:
        "201": { description: Project graph edge created }
  /v1/memory-links:
    post:
      operationId: linkMemories
      responses:
        "201": { description: Temporal memory graph edge created }
  /v1/handoffs:
    post:
      operationId: saveHandoffCheckpoint
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoffRequest" }
      responses:
        "201": { description: Structured checkpoint evaluated by capture policy and saved as active, proposed, or quarantined }
        "200": { description: Existing idempotent checkpoint returned }
  /v1/handoffs/latest:
    get:
      operationId: getLatestHandoff
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
        - name: task_id
          in: query
          required: true
          schema: { type: string }
        - name: branch
          in: query
          schema: { type: string }
      responses:
        "200": { description: Latest owner/project/task/branch-applicable checkpoint }
        "404": { description: No applicable checkpoint }
  /v1/stats:
    get:
      operationId: getTenantStats
      responses:
        "200": { description: Tenant-local counts and audit-chain status }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Private static bearer credential or an OIDC JWT verified against the configured issuer, audience, and JWKS.
  parameters:
    McpSessionId:
      name: MCP-Session-Id
      in: header
      required: false
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
    McpSessionIdRequired:
      name: MCP-Session-Id
      in: header
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
    MemoryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized: { description: Missing or invalid bearer token }
    Forbidden: { description: Caller lacks scope or project/sensitivity grant }
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        project_id: { type: string }
        dependency_depth: { type: integer, minimum: 0, maximum: 5, default: 2 }
        top_k: { type: integer, minimum: 1, maximum: 50, default: 8 }
        token_budget: { type: integer, minimum: 64, maximum: 32000, default: 1200 }
        branch: { type: string }
        as_of: { type: string, format: date-time }
        include_stale: { type: boolean, default: false }
        exclude_types: { type: array, maxItems: 32, items: { type: string } }
        retrieval_mode:
          type: string
          enum: [hybrid, graph-only, graph-first]
          default: hybrid
          description: Hybrid preserves eager semantic retrieval; graph-only never embeds; graph-first embeds only after insufficient graph coverage.
        graph_depth: { type: integer, minimum: 0, maximum: 3, default: 2 }
        strict_evidence: { type: boolean, default: false }
        graph_max_visited: { type: integer, minimum: 25, maximum: 2000, default: 400 }
        graph_max_paths: { type: integer, minimum: 1, maximum: 200, default: 40 }
    RetrievalMetadata:
      type: object
      required: [requested_mode, effective_mode, semantic_fallback_used, fallback_reason, graph_generation]
      properties:
        requested_mode: { type: string, enum: [hybrid, graph-only, graph-first] }
        effective_mode: { type: string, enum: [hybrid, graph-only, graph-first, lexical+graph] }
        semantic_fallback_used: { type: boolean }
        fallback_reason:
          type: [string, "null"]
          enum: [no_seed, insufficient_candidates, low_path_confidence, conceptual_query, semantic_unavailable, null]
        graph_generation:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/GraphGeneration"
            - type: object
              required: [generations, total_count, truncated]
              properties:
                generations: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/GraphGeneration" } }
                total_count: { type: integer, minimum: 1 }
                truncated: { type: boolean }
            - type: object
              required: [total_count, truncated]
              properties:
                total_count: { type: integer, minimum: 1 }
                truncated: { type: boolean }
    GraphGeneration:
      type: object
      required: [id, project_id]
      properties:
        id: { type: string }
        project_id: { type: string }
        branch: { type: [string, "null"] }
        commit: { type: string }
    GraphPathHop:
      type: object
      required: [edge_id, source_id, source_label, target_id, target_label, relation, direction, provenance, weight]
      properties:
        edge_id: { type: string }
        source_id: { type: string }
        source_label: { type: string }
        target_id: { type: string }
        target_label: { type: string }
        relation: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        provenance: { type: string, enum: [extracted, resolved, inferred] }
        weight: { type: number, minimum: 0, maximum: 1 }
        source_location: { type: [string, "null"] }
        commit: { type: string }
    MemoryInput:
      type: object
      required: [body, namespace_id]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000000 }
        title: { type: string, maxLength: 500 }
        namespace_id: { type: string }
        project_id: { type: string }
        type: { type: string, default: fact }
        subject_key: { type: string, maxLength: 200 }
        sensitivity: { type: string, enum: [public, private, sensitive, restricted] }
        source_type: { type: string }
        source_uri: { type: string, maxLength: 2048 }
        repo_path: { type: string }
        symbol: { type: string }
        git_commit: { type: string }
        branch: { type: string }
        tags: { type: array, maxItems: 64, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    CaptureRequest:
      type: object
      required: [body, project_id]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 65536 }
        title: { type: string, maxLength: 500 }
        project_id: { type: string, minLength: 1, maxLength: 200 }
        memory_kind: { type: string, enum: [working, inference, git-fact, decision], default: inference }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1 }
        sensitivity: { type: string, enum: [private, sensitive, restricted], default: private }
        ttl_seconds: { type: integer, minimum: 300, maximum: 2592000 }
        subject_key: { type: string, maxLength: 200 }
        repo_path: { type: string, maxLength: 1024 }
        symbol: { type: string, maxLength: 500 }
        git_commit: { type: string, maxLength: 64 }
        branch: { type: string, maxLength: 200 }
        content_checksum: { type: string, pattern: "^[A-Fa-f0-9]{64}$" }
        tags: { type: array, maxItems: 64, items: { type: string, maxLength: 200 } }
        idempotency_key: { type: string, maxLength: 512 }
        observed_at: { type: string, format: date-time }
    HandoffRequest:
      type: object
      required: [project_id, task_id, goal, current_state]
      additionalProperties: false
      properties:
        project_id: { type: string, minLength: 1, maxLength: 200 }
        task_id: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: string, minLength: 1, maxLength: 4000 }
        current_state: { type: string, minLength: 1, maxLength: 8000 }
        completed_work: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        unresolved_questions: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        next_actions: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        relevant_files: { type: array, maxItems: 128, items: { type: string, minLength: 1, maxLength: 1024 } }
        state: { type: string, enum: [in_progress, blocked, completed], default: in_progress }
        branch: { type: string, maxLength: 200 }
        git_commit: { type: string, maxLength: 64 }
        checkpoint_id: { type: string, maxLength: 200 }
        previous_checkpoint_id: { type: string, maxLength: 200 }
        sensitivity: { type: string, enum: [private, sensitive, restricted], default: private }
    HandoffPatch:
      type: object
      additionalProperties: false
      description: Partial structured handoff correction. Task and checkpoint identity cannot change.
      properties:
        task_id: { type: string, minLength: 1, maxLength: 200 }
        goal: { type: string, minLength: 1, maxLength: 4000 }
        current_state: { type: string, minLength: 1, maxLength: 8000 }
        completed_work: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        unresolved_questions: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        next_actions: { type: array, maxItems: 64, items: { type: string, minLength: 1, maxLength: 2000 } }
        relevant_files: { type: array, maxItems: 128, items: { type: string, minLength: 1, maxLength: 1024 } }
        state: { type: string, enum: [in_progress, blocked, completed] }
        branch: { type: [string, "null"], maxLength: 200 }
        git_commit: { type: [string, "null"], maxLength: 64 }
        checkpoint_id: { type: string, maxLength: 200 }
        previous_checkpoint_id: { type: [string, "null"], maxLength: 200 }
    MemoryResult:
      type: object
      required: [id, title, body, namespace_id, confidence, score, citation]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        namespace_id: { type: string }
        project_id: { type: [string, "null"] }
        confidence: { type: number }
        score: { type: number }
        score_signals: { type: object, additionalProperties: { type: number } }
        citation: { type: object, additionalProperties: true }
        graph_path: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/GraphPathHop" } }

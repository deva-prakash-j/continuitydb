name: release-binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-x64
            os: macos-13
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:binary
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/continuitydb-darwin-*
      - run: npm run checksum:binaries
      - uses: actions/upload-artifact@v4
        with:
          name: continuitydb-${{ matrix.name }}
          path: |
            dist/continuitydb-*
            !dist/.build/**
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: continuitydb-*
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release/continuitydb-*"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

name: release-binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:clients
      - name: Verify managed Windows upgrade and rollback contract
        run: node --test --test-name-pattern="Windows managed" test/self-install.test.js
      - run: npm run validate:clients
      - run: npm run validate:release-workflow
      - run: npm run build:binary
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/continuitydb-darwin-*
      - run: npm run test:opencode-global
      - run: npm run smoke:binary
      - run: npm run smoke:binary:semantic
      - run: npm run checksum:binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: continuitydb-${{ matrix.name }}
          path: |
            dist/continuitydb-*
            !dist/.build/**
          if-no-files-found: error
          retention-days: 14

  publish:
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify stable tag release eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            exit 0
          fi

          resolve_remote_tag_commit() {
            local object_type object_sha
            object_type="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')"
            object_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
            while [[ "$object_type" == "tag" ]]; do
              object_type="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.type')"
              object_sha="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.sha')"
            done
            [[ "$object_type" == "commit" ]]
            printf '%s\n' "$object_sha"
          }

          verify_stable_release_state() {
            package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            [[ "$GITHUB_REF_NAME" == "v${package_version}" ]]
            [[ "$GITHUB_REF" == "refs/tags/${GITHUB_REF_NAME}" ]]
            git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
            local_tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            [[ "$local_tag_sha" == "$GITHUB_SHA" ]]
            stable_tag_sha="$(resolve_remote_tag_commit)"
            [[ "$stable_tag_sha" == "$GITHUB_SHA" ]]
          }

          verify_stable_release_state
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: continuitydb-*
          path: release
          merge-multiple: true
      - name: Verify complete native release set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            continuitydb-linux-x64
            continuitydb-linux-x64.sha256
            continuitydb-darwin-arm64
            continuitydb-darwin-arm64.sha256
            continuitydb-win32-x64.exe
            continuitydb-win32-x64.exe.sha256
          )
          for asset in "${expected[@]}"; do
            test -f "release/$asset"
          done
          test "$(find release -maxdepth 1 -type f -name 'continuitydb-*' | wc -l | tr -d ' ')" = "${#expected[@]}"
          (
            cd release
            sha256sum -c continuitydb-linux-x64.sha256
            sha256sum -c continuitydb-darwin-arm64.sha256
            sha256sum -c continuitydb-win32-x64.exe.sha256
          )
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "release/continuitydb-*"
      - name: Resolve idempotent release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=main-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "title=ContinuityDB main build ${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=ContinuityDB $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_remote_tag_commit() {
            local object_type object_sha
            object_type="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')"
            object_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
            while [[ "$object_type" == "tag" ]]; do
              object_type="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.type')"
              object_sha="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.sha')"
            done
            [[ "$object_type" == "commit" ]]
            printf '%s\n' "$object_sha"
          }

          verify_stable_release_state() {
            package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            [[ "$GITHUB_REF_NAME" == "v${package_version}" ]]
            [[ "$GITHUB_REF" == "refs/tags/${GITHUB_REF_NAME}" ]]
            git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
            local_tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            [[ "$local_tag_sha" == "$GITHUB_SHA" ]]
            stable_tag_sha="$(resolve_remote_tag_commit)"
            [[ "$stable_tag_sha" == "$GITHUB_SHA" ]]
          }

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            existing_prerelease="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')"
            existing_draft="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
            [[ "$existing_draft" == "false" ]]
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              existing_target="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json targetCommitish --jq '.targetCommitish')"
              [[ "$existing_target" == "$GITHUB_SHA" ]]
              [[ "$existing_prerelease" == "true" ]]
            else
              [[ "$existing_prerelease" == "false" ]]
            fi
            if [[ "$RELEASE_PRERELEASE" == "false" ]]; then
              verify_stable_release_state
            fi
            gh release upload "$RELEASE_TAG" release/* --clobber --repo "$GH_REPO"
          elif [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --prerelease
          else
            verify_stable_release_state
            gh release create "$RELEASE_TAG" release/* \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --generate-notes
          fi
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_remote_tag_commit() {
            local object_type object_sha
            object_type="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')"
            object_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
            while [[ "$object_type" == "tag" ]]; do
              object_type="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.type')"
              object_sha="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.sha')"
            done
            [[ "$object_type" == "commit" ]]
            printf '%s\n' "$object_sha"
          }

          verify_stable_release_state() {
            package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
            [[ "$GITHUB_REF_NAME" == "v${package_version}" ]]
            [[ "$GITHUB_REF" == "refs/tags/${GITHUB_REF_NAME}" ]]
            git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
            local_tag_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            [[ "$local_tag_sha" == "$GITHUB_SHA" ]]
            stable_tag_sha="$(resolve_remote_tag_commit)"
            [[ "$stable_tag_sha" == "$GITHUB_SHA" ]]
          }

          published_prerelease="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')"
          published_draft="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft --jq '.isDraft')"
          [[ "$published_draft" == "false" ]]
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            published_target="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json targetCommitish --jq '.targetCommitish')"
            [[ "$published_target" == "$GITHUB_SHA" ]]
            [[ "$published_prerelease" == "true" ]]
          else
            published_tag="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName --jq '.tagName')"
            [[ "$published_tag" == "$GITHUB_REF_NAME" ]]
            [[ "$published_prerelease" == "false" ]]
            verify_stable_release_state
          fi

          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$verify_dir"
          expected=(
            continuitydb-darwin-arm64
            continuitydb-darwin-arm64.sha256
            continuitydb-linux-x64
            continuitydb-linux-x64.sha256
            continuitydb-win32-x64.exe
            continuitydb-win32-x64.exe.sha256
          )
          mapfile -t actual < <(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${actual[*]}" == "${expected[*]}" ]]

          for asset in "${expected[@]}"; do
            cmp -- "release/$asset" "$verify_dir/$asset"
          done
          (
            cd "$verify_dir"
            sha256sum -c continuitydb-linux-x64.sha256
            sha256sum -c continuitydb-darwin-arm64.sha256
            sha256sum -c continuitydb-win32-x64.exe.sha256
          )
          for asset in "${expected[@]}"; do
            gh attestation verify "$verify_dir/$asset" --repo "$GH_REPO"
          done

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate:openapi
      - run: npm run benchmark:quality
      - run: npm run benchmark:scale -- --records=100 --queries=50 --operations=40 --repetitions=1 --concurrency=1,4 --warmup=10
      - run: npm audit --omit=dev
      - run: npm pack --dry-run

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: continuitydb:test

  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:binary
      - run: npm run checksum:binaries
      - uses: actions/upload-artifact@v4
        with:
          name: continuitydb-linux-x64
          path: |
            dist/continuitydb-linux-x64
            dist/continuitydb-linux-x64.sha256
          if-no-files-found: error
          retention-days: 14
